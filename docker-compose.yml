services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-paigam_shifa}
      MYSQL_USER: ${MYSQL_USER:-paigam_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "3306:3306"
    volumes:
      - paigam_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-paigam_user}:${MYSQL_PASSWORD:-changeme}@db:3306/${MYSQL_DATABASE:-paigam_shifa}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - paigam_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  paigam_mysql_data:
  paigam_uploads:
